name: Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Semantic version produced by Release Please, without the v prefix
        required: false
        type: string
      tag_name:
        description: Git tag created by Release Please
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish image
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          !startsWith(github.event.pull_request.head.ref, 'release-please')) ||
        inputs.version != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/joselarantes/tucano-indices
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }},priority=600
            type=sha,format=long,priority=200
            type=raw,value=latest,priority=100

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
