<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10221e" />
    <meta name="description" content="Documentação interativa da API Tucano Indices" />
    <title>Tucano Indices API — Swagger UI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui.css" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #f5f7f6; }
      .topbar { background: #10221e; }
      .topbar-wrapper .link span { color: #eff9f3; }
      .swagger-ui .info .title { color: #10221e; }
      .swagger-ui .scheme-container { box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui-standalone-preset.js" crossorigin></script>
    <script>
      window.onload = () => {
        window.swaggerUI = SwaggerUIBundle({
          url: "/openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayRequestDuration: true,
          filter: true,
          persistAuthorization: false,
          validatorUrl: null,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout"
        });
      };
    </script>
  </body>
</html>
