services:
  tooling:
    image: golang:1.27.4-alpine
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - ./:/src
      - go_modules:/go/pkg/mod
    environment:
      GOTOOLCHAIN: local

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tucano
      POSTGRES_PASSWORD: tucano
      POSTGRES_DB: tucano_indices
    volumes:
      - ./data/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tucano -d tucano_indices"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: golang:1.27.4-alpine
    working_dir: /src
    volumes:
      - ./:/src
      - go_modules:/go/pkg/mod
    environment:
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://tucano:tucano@db:5432/tucano_indices?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: ["go install github.com/pressly/goose/v3/cmd/goose@v3.30.1 && goose -dir db/migrations postgres \"$$DATABASE_URL\" up"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: tucano-indices
      APP_ENV: ${APP_ENV:-development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8011}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://tucano:tucano@db:5432/tucano_indices?sslmode=disable
      API_TOKEN: ${API_TOKEN:-${BEARER_TOKEN:-dev-token-change-me}}
      INDICES_SGS_BASE_URL: ${INDICES_SGS_BASE_URL:-https://api.bcb.gov.br/dados/serie}
      INDICES_FOCUS_BASE_URL: ${INDICES_FOCUS_BASE_URL:-https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata}
      INDICES_B3_BASE_URL: ${INDICES_B3_BASE_URL:-https://sistemaswebb3-listados.b3.com.br/indexStatisticsProxy/IndexCall}
      INDICES_TESOURO_CSV_URL: ${INDICES_TESOURO_CSV_URL:-}
      INDICES_TESOURO_CKAN_URL: ${INDICES_TESOURO_CKAN_URL:-}
      INDICES_SELIC_SEARCH_URL: ${INDICES_SELIC_SEARCH_URL:-https://www3.bcb.gov.br/novoselic/rest/taxaSelicApurada/pub/search}
      OPENAPI_SPEC_PATH: /app/api/openapi.yaml
    ports:
      - "8011:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  index-sync:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["indices-sync"]
    entrypoint: ["/app/index-sync"]
    command: ["-source", "${INDICES_SYNC_SOURCE:-all}"]
    environment: &indices_environment
      DATABASE_URL: postgres://tucano:tucano@db:5432/tucano_indices?sslmode=disable
      INDICES_SGS_BASE_URL: ${INDICES_SGS_BASE_URL:-https://api.bcb.gov.br/dados/serie}
      INDICES_FOCUS_BASE_URL: ${INDICES_FOCUS_BASE_URL:-https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata}
      INDICES_B3_BASE_URL: ${INDICES_B3_BASE_URL:-https://sistemaswebb3-listados.b3.com.br/indexStatisticsProxy/IndexCall}
      INDICES_TESOURO_CSV_URL: ${INDICES_TESOURO_CSV_URL:-}
      INDICES_TESOURO_CKAN_URL: ${INDICES_TESOURO_CKAN_URL:-}
      INDICES_SELIC_SEARCH_URL: ${INDICES_SELIC_SEARCH_URL:-https://www3.bcb.gov.br/novoselic/rest/taxaSelicApurada/pub/search}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  index-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["indices-scheduler"]
    entrypoint: ["/app/scheduler"]
    environment: *indices_environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  go_modules:
