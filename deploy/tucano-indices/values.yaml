nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/joselarantes/tucano-indices
  # Empty uses Chart.appVersion, kept in sync by release-please.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

secrets:
  # Create this Secret outside Helm with DATABASE_URL and API_TOKEN keys.
  existingSecret: tucano-indices-secret

config:
  APP_NAME: tucano-indices
  APP_ENV: production
  APP_PUBLIC_URL: http://localhost:8011
  HTTP_ADDR: :8080
  INDICES_SGS_BASE_URL: https://api.bcb.gov.br/dados/serie
  INDICES_FOCUS_BASE_URL: https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata
  INDICES_B3_BASE_URL: https://sistemaswebb3-listados.b3.com.br/indexStatisticsProxy/IndexCall
  INDICES_TESOURO_CSV_URL: ""
  INDICES_TESOURO_CKAN_URL: ""
  INDICES_SELIC_SEARCH_URL: https://www3.bcb.gov.br/novoselic/rest/taxaSelicApurada/pub/search
  INDICES_HTTP_TIMEOUT: 45s
  TZ: America/Sao_Paulo

api:
  enabled: true
  replicaCount: 2
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 8080
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

scheduler:
  enabled: true
  replicaCount: 1
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrations:
  enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tucano-indices.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
